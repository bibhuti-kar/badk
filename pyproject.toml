[project]
name = "badk"
version = "0.1.0"
description = "Stateless, budget-bounded, cache-aligned multi-agent development kit"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.2.3,<11",
    "anthropic>=2.8.0,<3",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "fastjsonschema>=2.21,<3",
    "httpx>=0.28,<1",
    "jinja2>=3.1.4,<4",
    "mcp>=2.3,<3",  # M7c: the `mcp` tool type (kept sessions) and `badk mcp`
    "httpx2>=2.10,<3",  # M7c: mcp_pool builds the streamable HTTP client with it (mcp pins >=2.10)
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2,<7",
    "sqlalchemy[asyncio]>=2.0.36,<2.2",
    "structlog>=25.1,<27",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# examples/toolkit: web and API tools (scripts/init.sh installs badk with this extra)
toolkit = [
    "ddgs>=9.16,<10",
    "html2text>=2025.4.15",
]

[project.scripts]
badk = "badk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/badk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
# NT-007: one exclusion list (ruff, mypy, coverage)
extend-exclude = ["src/badk/viewer/static/mermaid.min.js"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN"]
extend-select = ["C901", "PLR0912", "PLR0913", "PLR0915", "ASYNC", "B", "S110", "S112"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 30      # ≈ the 30-line function rule
max-branches = 8
max-args = 5


[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tools"]
exclude = ["src/badk/viewer/static/mermaid\\.min\\.js"]
